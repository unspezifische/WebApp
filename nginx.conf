      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
      proxy_buffering off;
    }

    error_log /var/log/nginx/map_error.log;
    access_log /var/log/nginx/map_access.log;
  }

}
