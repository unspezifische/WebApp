      proxy_set_header X-Forwarded-Proto $scheme;
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD';
    }

    location /wiki-static/ {
      proxy_pass http://backend;
      include proxy_params;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      access_log off;
      expires 7d;
    }

    location /5etools/ {
      alias /home/ijohnson/5etools-src/;
      index index.html;
      try_files $uri $uri/ =404;
    }

    location /admin/ {
      proxy_pass http://backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard/ {
      proxy_pass http://backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
      alias /home/ijohnson/Kachhapa/Flask/media/;
      access_log off;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    # Directly proxy /api and /socket.io without redirects to avoid websocket handshake issues

    location /api/ {
      access_log /var/log/nginx/api_access.log;
      error_log  /var/log/nginx/api_error.log debug;

      proxy_pass http://unix:/home/ijohnson/Kachhapa/Flask/myapp.sock:/api/;
      include proxy_params;

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

      # OPTIONS preflight
      if ($request_method = OPTIONS) { return 204; }
    }

    location /socket.io/ {
      access_log /var/log/nginx/ws_access.log;
      error_log  /var/log/nginx/ws_error.log;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;

      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
      proxy_buffering off;

      proxy_pass http://unix:/home/ijohnson/Kachhapa/Flask/myapp.sock:/socket.io/;
      include proxy_params;

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

      if ($request_method = OPTIONS) { return 204; }
    }
  }

  # mtg.raspberrypi.local
  server {
    listen 80;
    server_name mtg.raspberrypi.local;

    root /home/ijohnson/MtG-webapp/frontend/build;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html =503;
    }

    location /api/ {
      proxy_pass http://mtg_backend/api/;
      include proxy_params;

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
