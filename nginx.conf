    location /mtg/socket.io/ {
      proxy_pass http://mtg_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
      proxy_buffering off;
    }

    location /mtg/card-images/ {
      alias /opt/mtg-sandbox/images/cards/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri =404;
    }

    location / {
      root /home/ijohnson/Kachhapa/webapp/build;
      index index.html;
      try_files $uri $uri/ /index.html;  # fallback to index.html
    }

    location /wiki/ {
      proxy_pass http://backend;
      include proxy_params;
      proxy_set_header Host $host;
