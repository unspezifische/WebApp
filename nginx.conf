  # maps.raspberrypi.local
  server {
    listen 80;
    server_name maps.raspberrypi.local;

    location / {
      proxy_pass http://foundry_vtt;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
