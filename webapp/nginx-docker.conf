user nginx;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  client_max_body_size 2000M; # Increase this if you need to upload large files

  map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      ''; # If there's no Upgrade header (long-polling), don't send one!
    }

  upstream backend {
    server unix:/tmp/myapp.socket;
    keepalive 32;
  }

  # Localhost
  server {
    listen 80;
    server_name localhost;

    # Serve the React production build directly
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;  # SPA fallback for React Router
    }

    location /wiki/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flask's server-rendered wiki uses its own asset namespace so those files
    # do not collide with the React build's /static directory.
    location /wiki-static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Module maps and uploaded campaign media live in the Flask container.
    # Without this route nginx returns the React index for image requests,
    # which causes Three.js texture loading to reject the settlement scene.
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # For the standalone 5etools static site
    location /5etools/ {
      alias /var/www/5etools/;
      index index.html;
      try_files $uri $uri/ =404;
    }

    # Admin interface for the Flask server
    location /admin/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard interface for the Flask server
    location /dashboard/ {
      proxy_pass http://unix:/tmp/myapp.socket:/dashboard/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
      rewrite ^/api$ /api/ permanent;
    }

    location /api/ {
      access_log /var/log/nginx/api_access.log;
      error_log /var/log/nginx/api_error.log debug;

      proxy_pass http://backend;

      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD';
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
    }

    location /socket.io {
      access_log /var/log/nginx/ws_access.log;
      error_log /var/log/nginx/ws_error.log debug;

      if ($request_method = 'OPTIONS') {
          add_header 'Access-Control-Allow-Origin' '*' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
          add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
          add_header 'Access-Control-Max-Age' 1728000;
          add_header 'Content-Type' 'text/plain; charset=utf-8';
          add_header 'Content-Length' 0;
          return 204; 
      }

      # Pass straight through cleanly to your unix socket backend upstream
      proxy_pass http://backend;
      proxy_http_version 1.1;
      
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
      proxy_buffering off;

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
    }


  }
}
